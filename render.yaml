# OzarkRoost — Render Blueprint
# Deploy: Render Dashboard → New → Blueprint → connect OzarkRoosts/OzarkRoost (main)
# Database: use Neon (free) and paste DATABASE_URL — do not use Render free Postgres (expires).

services:
  - type: web
    runtime: node
    name: ozarkroost
    plan: free
    region: oregon
    branch: main
    buildCommand: npm ci
    preDeployCommand: npm run migrate
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        sync: false
      - key: APP_URL
        sync: false
      - key: STRIPE_SECRET_KEY
        sync: false
      - key: STRIPE_WEBHOOK_SECRET
        sync: false
      - key: STRIPE_PAYMENT_LINK_URL
        sync: false
      - key: OPENAI_API_KEY
        sync: false
      - key: OPENAI_MODEL
        value: gpt-4o-mini
      - key: SMTP_HOST
        sync: false
      - key: SMTP_PORT
        sync: false
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASS
        sync: false
      - key: EMAIL_FROM
        sync: false
      - key: AFF_STAY22_URL
        sync: false
      - key: AFF_HIPCAMP_URL
        sync: false
      - key: AFF_GETYOURGUIDE_URL
        sync: false
      - key: AFF_VIATOR_URL
        sync: false
      - key: AFF_REI_URL
        sync: false
      - key: AFF_PUBLICLANDS_URL
        sync: false
      - key: AFF_VRBO_URL
        sync: false
      - key: AFF_BOOKING_URL
        sync: false
      - key: SITE_HEALTH_ENABLED
        value: "true"
      - key: AFFILIATE_OPS_ENABLED
        value: "true"
      - key: SUPERAGENT_ENABLED
        value: "true"
      - key: AUTONOMOUS_MODE
        value: "false"
      - key: MARKETING_ENABLED
        value: "false"
      - key: OPSBOT_ENABLED
        value: "false"

  - type: cron
    name: ozarkroost-nurture-emails
    runtime: node
    plan: free
    region: oregon
    branch: main
    schedule: "0 * * * *"
    buildCommand: npm ci
    startCommand: node jobs/send-nurture-emails.js
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        sync: false
      - key: APP_URL
        sync: false
      - key: SMTP_HOST
        sync: false
      - key: SMTP_PORT
        sync: false
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASS
        sync: false
      - key: EMAIL_FROM
        sync: false
