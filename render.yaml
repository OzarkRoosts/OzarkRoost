# OzarkRoost — Render Blueprint
# Production web service. Secrets stay in Render, never in Git.
services:
  - type: web
    runtime: node
    name: ozarkroost
    plan: free
    region: oregon
    branch: main
    buildCommand: npm ci && npm run migrate
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        sync: false
      - key: APP_URL
        sync: false
      - key: OPENAI_API_KEY
        sync: false
      - key: OPENAI_MODEL
        value: gpt-4o-mini
      - key: SITE_HEALTH_ENABLED
        value: "true"
      - key: AFFILIATE_OPS_ENABLED
        value: "true"
      - key: PARTNER_DISCOVERY_ENABLED
        value: "true"
      - key: SUPERAGENT_ENABLED
        value: "true"
      - key: MARKETING_ENABLED
        value: "true"
      - key: OPSBOT_ENABLED
        value: "true"
      - key: AUTONOMOUS_MODE
        value: "false"
      - key: BILLING_AUTONOMOUS_MODE
        value: "false"
      - key: STRIPE_SECRET_KEY
        sync: false
      - key: STRIPE_WEBHOOK_SECRET
        sync: false
      - key: STRIPE_PAYMENT_LINK_URL
        sync: false
      - key: SMTP_HOST
        sync: false
      - key: SMTP_PORT
        value: "587"
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASS
        sync: false
      - key: EMAIL_FROM
        sync: false
      # Supply the actual partner-generated URLs/IDs from each affiliate dashboard.
      # The app never fabricates commissionable IDs.
      - key: AFF_STAY22_URL
        sync: false
      - key: AFF_HIPCAMP_URL
        sync: false
      - key: AFF_GETYOURGUIDE_URL
        sync: false
      - key: AFF_VIATOR_URL
        sync: false
      - key: AFF_REI_URL
        sync: false
      - key: AFF_PUBLICLANDS_URL
        sync: false
      - key: AFF_VRBO_URL
        sync: false
      - key: AFF_BOOKING_URL
        sync: false
      - key: AFF_OUTDOORSY_URL
        sync: false
      - key: AFF_RVSHARE_URL
        sync: false
      - key: AFF_EXPEDIA_URL
        sync: false
      - key: AFF_HOTELS_URL
        sync: false
      - key: AFF_KAYAK_URL
        sync: false
      - key: AFF_TRIPADVISOR_URL
        sync: false
      - key: AFF_KLOOK_URL
        sync: false
      - key: AFF_ALLTRAILS_URL
        sync: false
      - key: AFF_AIRBNB_URL
        sync: false
      - key: AFF_RECREATION_URL
        sync: false
      - key: AFF_AMAZON_TAG
        sync: false
      - key: AFF_AMAZON_CAMPING_URL
        sync: false
      - key: AFF_AMAZON_KAYAK_URL
        sync: false
      - key: AFF_AMAZON_BINOCULARS_URL
        sync: false
