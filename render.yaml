# OzarkRoost — Render Blueprint
# Production web service only. The nurture-email cron is intentionally not
# declared here because Render does not offer free cron-job instances.
# If/when paid cron is enabled, add it as a separate Render service.
# Database: use Neon (free) and set DATABASE_URL in Render.

services:
  - type: web
    runtime: node
    name: ozarkroost
    plan: free
    region: oregon
    branch: main
    # Free Render web services cannot use pre-deploy commands.
    # Migrations are run during the build instead; server startup also
    # performs an idempotent migration pass as a safety net.
    buildCommand: npm ci && npm run migrate
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        sync: false
      - key: APP_URL
        sync: false
      - key: STRIPE_SECRET_KEY
        sync: false
      - key: STRIPE_WEBHOOK_SECRET
        sync: false
      - key: STRIPE_PAYMENT_LINK_URL
        sync: false
      - key: OPENAI_API_KEY
        sync: false
      - key: OPENAI_MODEL
        value: gpt-4o-mini
      - key: SMTP_HOST
        sync: false
      - key: SMTP_PORT
        sync: false
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASS
        sync: false
      - key: EMAIL_FROM
        sync: false
      - key: AFF_STAY22_URL
        sync: false
      - key: AFF_HIPCAMP_URL
        sync: false
      - key: AFF_GETYOURGUIDE_URL
        sync: false
      - key: AFF_VIATOR_URL
        sync: false
      - key: AFF_REI_URL
        sync: false
      - key: AFF_PUBLICLANDS_URL
        sync: false
      - key: AFF_VRBO_URL
        sync: false
      - key: AFF_BOOKING_URL
        sync: false
      - key: SITE_HEALTH_ENABLED
        value: "true"
      - key: AFFILIATE_OPS_ENABLED
        value: "true"
      - key: PARTNER_DISCOVERY_ENABLED
        value: "true"
      - key: SUPERAGENT_ENABLED
        value: "true"
      - key: AUTONOMOUS_MODE
        value: "false"
      - key: MARKETING_ENABLED
        value: "false"
      - key: OPSBOT_ENABLED
        value: "false"
