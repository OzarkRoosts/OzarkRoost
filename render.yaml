# OzarkRoost — canonical Render Blueprint
# One production web service. Secrets stay in Render, never in Git.
services:
  - type: web
    runtime: node
    name: ozarkroost
    plan: starter
    region: oregon
    branch: main
    buildCommand: npm install
    startCommand: node start.js
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: NODE_OPTIONS
        value: "--require=./lib/runtime-env.js"
      - key: DATABASE_URL
        fromDatabase:
          name: ozarkroost-db
          property: connectionString
      - key: APP_URL
        sync: false
      - key: SITE_URL
        sync: false
      - key: OPENAI_API_KEY
        sync: false
      - key: OPENAI_AI_ENABLED
        value: "true"
      - key: OPENAI_MODEL
        value: gpt-5.6-luna
      - key: SITE_HEALTH_ENABLED
        value: "true"
      - key: AFFILIATE_OPS_ENABLED
        value: "true"
      - key: AFFILIATE_APPLICATION_EXECUTION
        value: "true"
      - key: PARTNER_DISCOVERY_ENABLED
        value: "true"
      - key: SUPERAGENT_ENABLED
        value: "true"
      - key: MARKETING_ENABLED
        value: "true"
      - key: OPSBOT_ENABLED
        value: "true"
      - key: AUTONOMOUS_MODE
        value: "false"
      - key: BILLING_AUTONOMOUS_MODE
        value: "false"
      - key: STRIPE_SECRET_KEY
        sync: false
      - key: STRIPE_WEBHOOK_SECRET
        sync: false
      - key: STRIPE_STARTER_PAYMENT_LINK_URL
        sync: false
      - key: STRIPE_FEATURED_PAYMENT_LINK_URL
        sync: false
      - key: STRIPE_DOMINANT_PAYMENT_LINK_URL
        sync: false
      - key: STRIPE_PAYMENT_LINK_URL
        sync: false
      - key: MAILTRAP_TOKEN
        sync: false
      - key: MAILTRAP_FROM_EMAIL
        sync: false
      - key: MAILTRAP_FROM_NAME
        value: OzarkRoost
      - key: SMTP_HOST
        sync: false
      - key: SMTP_PORT
        value: "587"
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASS
        sync: false
      - key: EMAIL_FROM
        sync: false
      - key: TRAVELPAYOUTS_API_TOKEN
        sync: false
      - key: TRAVELPAYOUTS_API_ENABLED
        value: "true"
      - key: STAY22_API_TOKEN
        sync: false
      - key: AFFILIATE_APPLICANT_NAME
        sync: false
      - key: AFFILIATE_APPLICANT_EMAIL
        sync: false
      - key: AFFILIATE_APPLICANT_COMPANY
        sync: false
      - key: AFFILIATE_APPLICANT_PHONE
        sync: false
      - key: AFFILIATE_APPLICANT_ADDRESS
        sync: false
      - key: AFFILIATE_APPLICANT_COUNTRY
        value: "United States"
      - key: AFFILIATE_APPLICANT_DESCRIPTION
        sync: false
      - key: AFF_STAY22_URL
        sync: false
      - key: AFF_TRAVELPAYOUTS_URL
        sync: false
      - key: AFF_HIPCAMP_URL
        sync: false
      - key: AFF_GETYOURGUIDE_URL
        sync: false
      - key: AFF_VIATOR_URL
        sync: false
      - key: AFF_REI_URL
        sync: false
      - key: AFF_PUBLICLANDS_URL
        sync: false
      - key: AFF_VRBO_URL
        sync: false
      - key: AFF_BOOKING_URL
        sync: false
      - key: AFF_OUTDOORSY_URL
        sync: false
      - key: AFF_RVSHARE_URL
        sync: false
      - key: AFF_EXPEDIA_URL
        sync: false
      - key: AFF_HOTELS_URL
        sync: false
      - key: AFF_KAYAK_URL
        sync: false
      - key: AFF_TRIPADVISOR_URL
        sync: false
      - key: AFF_KLOOK_URL
        sync: false
      - key: AFF_ALLTRAILS_URL
        sync: false
      - key: AFF_AIRBNB_URL
        sync: false
      - key: AFF_RECREATION_URL
        sync: false
      - key: AFF_KOA_URL
        sync: false
      - key: AFF_CABELA_URL
        sync: false
      - key: AFF_NATIONALPARKTRIPS_URL
        sync: false
      - key: AFF_AMAZON_TAG
        sync: false
      - key: AFF_AMAZON_CAMPING_URL
        sync: false
      - key: AFF_AMAZON_KAYAK_URL
        sync: false
      - key: AFF_AMAZON_BINOCULARS_URL
        sync: false

# Existing production Postgres resource used by the canonical service.
databases:
  - name: ozarkroost-db
    plan: free
    region: oregon
