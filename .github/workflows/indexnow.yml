name: IndexNow Discovery

on:
  push:
    branches: [main]
    paths:
      - 'views/**'
      - 'public/**'
      - 'lib/**'
      - 'routes/**'
      - 'scripts/indexnow-submit.js'
  schedule:
    - cron: '15 6 * * *'
  workflow_dispatch:

jobs:
  submit:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Wait for deployment after push
        if: github.event_name == 'push'
        run: sleep 60
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Submit sitemap URLs to IndexNow
        env:
          SITE_URL: https://ozartkroost.onrender.com
        run: node scripts/indexnow-submit.js
