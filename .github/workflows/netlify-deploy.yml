name: Deploy to Netlify (when tokens provided)

on:
  workflow_dispatch:
  push:
    branches: [ gh-pages, master, main, ozarkroosts-monetize-ozark-roost ]

jobs:
  deploy:
    runs-on: ubuntu-latest
    if: ${{ secrets.NETLIFY_AUTH_TOKEN && secrets.NETLIFY_SITE_ID }}
    steps:
      - uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '18'
      - name: Install netlify-cli
        run: npm install -g netlify-cli
      - name: Deploy to Netlify
        env:
          NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
          NETLIFY_SITE_ID: ${{ secrets.NETLIFY_SITE_ID }}
        run: |
          netlify deploy --dir=./ --site=$NETLIFY_SITE_ID --prod --auth=$NETLIFY_AUTH_TOKEN
