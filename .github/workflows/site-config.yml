name: Site configuration and affiliate generation

on:
  workflow_dispatch: {}
  push:
    branches: [ gh-pages, master, main, ozarkroosts-monetize-ozark-roost ]

jobs:
  generate-affiliates:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Install deps
        run: npm ci || echo "no package.json"

      - name: Generate affiliates and redirects
        env:
          AFFILIATES_JSON: ${{ secrets.AFFILIATES_JSON }}
        run: |
          node scripts/generate_affiliates.js

      - name: Replace GA meta if provided
        run: |
          if [ -n "${{ secrets.GA_ID }}" ]; then
            echo "Setting GA ID in index.html"
            python3 - <<'PY'
import sys
from pathlib import Path
p=Path('index.html')
s=p.read_text()
start='meta name="ga-id" content="'
if 'meta name="ga-id"' in s:
  s=s.replace('meta name="ga-id" content=""', f'meta name="ga-id" content="${{secrets.GA_ID}}"')
  p.write_text(s)
PY
          else
            echo "No GA_ID secret set"
          fi

      - name: Commit changes
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add affiliates.json r/ affiliate-index.html index.html || true
          git commit -m "chore: generate affiliates and set GA if provided" || echo "no changes"
          git push

  send-ga-test:
    needs: generate-affiliates
    runs-on: ubuntu-latest
    if: ${{ secrets.GA_ID && secrets.GA_API_SECRET }}
    steps:
      - name: Send GA4 test event via Measurement Protocol
        run: |
          echo "Sending test event to GA4"
          curl -s -X POST "https://www.google-analytics.com/mp/collect?measurement_id=${{ secrets.GA_ID }}&api_secret=${{ secrets.GA_API_SECRET }}" \
            -H 'Content-Type: application/json' \
            -d '{"client_id":"555","events":[{"name":"site_deploy_test","params":{"engagement_time_msec":100}}]}'
